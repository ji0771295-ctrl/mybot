<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Video</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e1e1e; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .thumb { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #0088cc; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-unlock { background: linear-gradient(45deg, #ff007f, #7f00ff); color: white; }
        .btn-success { background: #28a745; color: white; display: none; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="card">
    <img id="thumb" class="thumb" src="https://via.placeholder.com/400x200?text=Loading..." alt="Thumbnail">
    <div id="video-title" class="title">ভিডিও লোড হচ্ছে...</div>

    <button id="ad-btn" class="btn btn-unlock" onclick="handleAdClick()">🔒 UNLOCK (0/3)</button>
    <button id="get-btn" class="btn btn-success" onclick="redirectToBot()">🎬 Get Video (ভিডিও দেখুন)</button>

    <div id="status" class="status">ভিডিও দেখতে ৩টি অ্যাডে ক্লিক করুন।</div>
</div>

<script>
    const adLinks = [
        "https://www.effectivecpmnetwork.com/gpszwa2a?key=fdc67f838f031020b45d5500045beb0d",
        "https://www.effectivecpmnetwork.com/yxqj3v7x?key=5c87c0323ef1b86c120aecb95392d96a",
        "https://www.effectivecpmnetwork.com/h95nhbcbu?key=d326ecd341b3ed1b724abdf4bafb257c"
    ];

    let currentAd = 0;
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || '';
    const title = urlParams.get('t') || 'এক্সক্লুসিভ ভিডিও';
    const thumb = urlParams.get('i') || 'https://via.placeholder.com/400x200';

    document.getElementById('video-title').innerText = title;
    document.getElementById('thumb').src = thumb;

    function handleAdClick() {
        if (currentAd < adLinks.length) {
            window.open(adLinks[currentAd], '_blank');
            currentAd++;
            
            const btn = document.getElementById('ad-btn');
            btn.innerText = `🔒 UNLOCK (${currentAd}/3)`;

            if (currentAd === 3) {
                btn.style.display = 'none';
                document.getElementById('get-btn').style.display = 'block';
                document.getElementById('status').innerText = '✅ আনলক সফল হয়েছে! নিচের বাটনে চাপ দিন।';
            }
        }
    }

    function redirectToBot() {
        if (videoId) {
            window.location.href = `https://t.me/MySongPremium2026Bot?start=${videoId}`;
        } else {
            alert('ভিডিও আইডি পাওয়া যায়নি!');
        }
    }
</script>

</body>
</html>
