<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Song Premium - Mini App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        .container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 16px; }
        .header { text-align: center; padding: 10px 0; border-bottom: 2px dashed #eee; margin-bottom: 15px; }
        .header h1 { color: #7c3aed; font-size: 22px; font-weight: 800; }
        .header p { color: #6b7280; font-size: 12px; }
        
        .song-banner { background: linear-gradient(135deg, #a7f3d0 0%, #059669 100%); color: #064e3b; padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .song-banner p { font-size: 13px; font-weight: 600; }
        .song-btn { background: #ffffff; color: #059669; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 700; }
        
        .video-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 15px; }
        .video-title { font-size: 15px; font-weight: 700; color: #1f2937; margin-bottom: 10px; }
        .thumbnail-container { width: 100%; height: 200px; border-radius: 12px; overflow: hidden; background: #e5e7eb; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        .instruction { font-size: 12px; color: #4b5563; margin-bottom: 15px; line-height: 1.4; }
        
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
        .btn-unlock { background: #7c3aed; color: #ffffff; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-ready { background: #10b981; color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .timer-text { font-size: 13px; color: #ef4444; font-weight: 700; margin-top: 8px; text-align: center; min-height: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>My Song Premium 🎵</h1>
        <p>@MySongPremium2026Bot</p>
    </div>

    <!-- Optional Song Banner -->
    <div class="song-banner">
        <p>🎵 গানটি শুনুন (অপশনাল)</p>
        <a href="https://youtu.be/lKCEIXIlohg?si=hBFmGi8tFPuPwq-I" target="_blank" class="song-btn">Play Song</a>
    </div>

    <!-- Video Card -->
    <div class="video-card">
        <div id="videoTitle" class="video-title">এক্সক্লুসিভ ভিডিও লোড হচ্ছে...</div>
        <div class="thumbnail-container">
            <img id="videoThumb" src="https://via.placeholder.com/400x200?text=Loading..." alt="Thumbnail">
        </div>
        <p class="instruction">ভিডিও পেতে UNLOCK বাটনে ক্লিক করুন এবং অ্যাড পেজে <b>১০ সেকেন্ড</b> থাকুন।</p>
    </div>

    <button id="mainBtn" class="action-btn btn-unlock" onclick="handleUnlock()">
        🔒 UNLOCK (1/3)
    </button>
    <div id="timerDisplay" class="timer-text"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || '';
    const title = urlParams.get('t') ? decodeURIComponent(urlParams.get('t')) : 'এক্সক্লুসিভ ভিডিও';
    const thumb = urlParams.get('i') ? decodeURIComponent(urlParams.get('i')) : '';

    document.getElementById('videoTitle').innerText = title;
    if (thumb) document.getElementById('videoThumb').src = thumb;

    let currentStep = 1;
    const totalSteps = 3;
    let adOpenTime = 0;
    let isWaitingForReturn = false;

    const AD_LINKS = [
        "https://www.effectivecpmnetwork.com/gpszwa2a?key=fdc67f838f031020b45d5500045beb0d",
        "https://www.effectivecpmnetwork.com/yxqj3v7x?key=5c87c0323ef1b86c120aecb95392d96a",
        "https://www.effectivecpmnetwork.com/h95nhbcbu?key=d326ecd341b3ed1b724abdf4bafb257c"
    ];

    function handleUnlock() {
        if (currentStep <= totalSteps) {
            adOpenTime = Date.now(); // অ্যাড খোলার সময় রেকর্ড
            isWaitingForReturn = true;
            
            // নতুন ট্যাবে অ্যাড ওপেন
            window.open(AD_LINKS[currentStep - 1], '_blank');
            
            document.getElementById('timerDisplay').style.color = "#2563eb";
            document.getElementById('timerDisplay').innerText = "⏳ এডের পেজে অন্তত ১০ সেকেন্ড সময় কাটান, তারপর এখানে ফিরুন...";
        }
    }

    // ইউজার মিনি অ্যাপে ফিরে আসলে ১০ সেকেন্ড হিসাব করা
    document.addEventListener("visibilitychange", function() {
        if (!document.hidden && isWaitingForReturn) {
            const timeSpent = Math.floor((Date.now() - adOpenTime) / 1000);

            if (timeSpent < 10) {
                // ১০ সেকেন্ডের কম সময় থাকলে রিজেক্ট করবে
                const required = 10 - timeSpent;
                alert(`⚠️ আপনি মাত্র ${timeSpent} সেকেন্ড এডে ছিলেন!\nভিডিও আনলক করতে আরও ${required} সেকেন্ড এডের পেজে থাকতে হবে।`);
                document.getElementById('timerDisplay').style.color = "#ef4444";
                document.getElementById('timerDisplay').innerText = `❌ আপনি ১০ সেকেন্ড পূরণ করেননি! আবার চেষ্টা করুন।`;
            } else {
                // ১০ সেকেন্ড বা তার বেশি থাকলে আনলক সফল
                isWaitingForReturn = false;
                currentStep++;

                if (currentStep <= totalSteps) {
                    document.getElementById('mainBtn').innerText = `🔒 UNLOCK (${currentStep}/${totalSteps})`;
                    document.getElementById('timerDisplay').style.color = "#059669";
                    document.getElementById('timerDisplay').innerText = `✅ অ্যাড ${currentStep - 1} সফল! পরের ধাপে ক্লিক করুন।`;
                } else {
                    const btn = document.getElementById('mainBtn');
                    btn.className = "action-btn btn-ready";
                    btn.innerText = "🎬 ভিডিও পেতে এখানে ক্লিক করুন (Telegram)";
                    btn.onclick = redirectToTelegram;
                    document.getElementById('timerDisplay').style.color = "#059669";
                    document.getElementById('timerDisplay').innerText = `🎉 ৩টি ধাপ সম্পন্ন হয়েছে!`;
                }
            }
        }
    });

    function redirectToTelegram() {
        if (!videoId) {
            alert("ভিডিও আইডি পাওয়া যায়নি!");
            return;
        }
        window.location.href = `https://t.me/MySongPremium2026Bot?start=${videoId}`;
    }
</script>

</body>
</html>
